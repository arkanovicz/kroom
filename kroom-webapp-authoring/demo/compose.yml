# The authoring demo, with a mailbox — from the repository root:
#   KROOM_UID=$(id -u) KROOM_GID=$(id -g) docker compose -f kroom-webapp-authoring/demo/compose.yml up
# then http://localhost:8099/login (admin / admin). Mailpit, on :8025, is a debugging mailbox where whatever the
# site sends lands — a form's notification, for one.
#
# The demo is built by the repository's own wrapper, as the user who runs it; the velocity BETA comes from the
# host's maven-local and known dependencies from the host's Gradle cache, both read-only.

services:
  kroom-demo:
    container_name: kroom-demo
    image: eclipse-temurin:21-jdk
    user: "${KROOM_UID:-1000}:${KROOM_GID:-1000}"
    working_dir: /kroom
    environment:
      GRADLE_USER_HOME: /kroom/kroom-webapp-authoring/demo/data/gradle
      GRADLE_RO_DEP_CACHE: /gradle-ro
      HOME: /kroom/kroom-webapp-authoring/demo/data/home
      KROOM_SMTP: kroom-mailpit:1025
    volumes:
      - ../..:/kroom
      - ${HOME}/.m2/repository:/m2:ro
      - ${HOME}/.gradle/caches:/gradle-ro:ro
    command: ./gradlew --no-daemon --console=plain -Dmaven.repo.local=/m2 :kroom-demo:run -Pport=8080
    ports:
      - "${KROOM_DEMO_PORT:-8099}:8080"
    depends_on:
      - kroom-mailpit

  kroom-mailpit:
    container_name: kroom-mailpit
    image: axllent/mailpit
    ports:
      - "${KROOM_MAILPIT_PORT:-8025}:8025"
