# The authoring demo, with a mailbox — from the repository root:
#   KROOM_UID=$(id -u) KROOM_GID=$(id -g) docker compose -f kroom-webapp-authoring/demo/compose.yml up
# then http://localhost:8099/login (admin / admin). Mailpit, on :8025, is a debugging mailbox where whatever the
# site sends lands — a form's notification, for one.
#
# Gradle builds the demo and leaves: the container then runs the installed distribution, so nothing holds a
# Gradle lock while the site is up and a build on the host goes beside it. The wrapper, the Gradle home and
# maven-local (the velocity BETA) are the host's, as the user who runs it.

services:
  kroom-demo:
    container_name: kroom-demo
    image: eclipse-temurin:21-jdk
    user: "${KROOM_UID:-1000}:${KROOM_GID:-1000}"
    working_dir: /kroom
    environment:
      GRADLE_USER_HOME: /gradle
      HOME: /kroom/kroom-webapp-authoring/demo/data/home
      JAVA_OPTS: -Dport=8080
      KROOM_SMTP: kroom-mailpit:1025
    volumes:
      - ../..:/kroom
      - ${HOME}/.m2/repository:/m2:ro
      - ${HOME}/.gradle:/gradle
    command: >-
      sh -c "./gradlew --no-daemon --console=plain -Dmaven.repo.local=/m2 :kroom-webapp-authoring-demo:installDist
      && exec kroom-webapp-authoring/demo/build/install/kroom-webapp-authoring-demo/bin/kroom-webapp-authoring-demo"
    ports:
      - "${KROOM_DEMO_PORT:-8099}:8080"
    depends_on:
      - kroom-mailpit

  kroom-mailpit:
    container_name: kroom-mailpit
    image: axllent/mailpit
    ports:
      - "${KROOM_MAILPIT_PORT:-8025}:8025"
