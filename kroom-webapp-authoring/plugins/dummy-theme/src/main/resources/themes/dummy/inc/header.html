<header class="dummy-header">
    <a href="/" class="dummy-brand">$theme.siteName</a>
    <nav>
    #foreach($item in $nav.items)
        <a href="$item.href"#if($nav.contains($item)) aria-current="page"#end>$item.label</a>
    #end
    #if($logged)
        <form method="post" action="/logout"><button type="submit">$logged.name ×</button></form>
    #elseif($site.login)
        <a href="$site.login">log in</a>
    #end
    </nav>
</header>
