    <title>#if($title)$title — #end$theme.siteName</title>
    <link rel="stylesheet" href="/lib/pico/pico.min.css">
    <link rel="stylesheet" href="/css/basic/theme.css?v=$site.version">
    $site.head()
</head>
<body>
#parse("themes/basic/inc/header.html")
<main class="container">

</main>
#parse("themes/basic/inc/footer.html")
$site.foot()
</body>
</html>
