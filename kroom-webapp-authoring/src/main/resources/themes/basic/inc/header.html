<header class="container">
    <nav>
        <ul><li><a href="/" class="basic-brand"><strong>$theme.siteName</strong></a></li></ul>
        <ul>
        #foreach($item in $nav.items)
            <li><a href="$item.href"#if($nav.contains($item)) aria-current="page"#end#if($item.external) rel="external"#end>$item.label</a></li>
        #end
        #if($logged)
            <li><form method="post" action="/logout" class="basic-logout"><button type="submit" class="secondary outline">$logged.name ⏻</button></form></li>
        #elseif($site.login)
            <li><a href="$site.login">log in</a></li>
        #end
        </ul>
    </nav>
</header>
