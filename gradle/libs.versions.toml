nimbus-oidc-sdk = { module = "com.nimbusds:oauth2-oidc-sdk", version.ref = "nimbus-oidc-sdk" }

# Android
androidx-core = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
androidx-webkit = { module = "androidx.webkit:webkit", version = "1.12.1" }
android-material = { module = "com.google.android.material:material", version = "1.12.0" }
slf4j-handroid = { module = "sk.baka.slf4j:slf4j-handroid", version = "2.0.13" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
antlr = { id = "com.strumenta.antlr-kotlin", version.ref = "antlr-kotlin" }
atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "kotlinx-atomicfu" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
nexusPublish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexus-publish" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versionsPlugin" }
