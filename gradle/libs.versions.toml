[versions]
agp = "8.5.2"
kotlin = "2.3.0"
dokka = "1.9.20"
nexus-publish = "2.0.0"
antlr-kotlin = "1.0.5"
bouncycastle = "1.81"
commons-collections4 = "4.5.0"
commons-lang3 = "3.18.0"
essential-kson = "2.14"
h2 = "2.3.232"
evo-inflector = "1.3"
kddl = "0.24"
kotlin-logging = "7.0.7"
kotlinx-atomicfu = "0.29.0"
kotlinx-datetime = "0.7.1"
kotlinx-coroutines = "1.10.2"
