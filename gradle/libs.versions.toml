[versions]
agp = "9.2.1"
kotlin = "2.4.21"
dokka = "2.2.0"
maven-publish = "0.37.0"
# velocity 3.0 pins the antlr-kotlin runtime at 1.0.10; the generated `%` lexer in kroom-markdown must match it
antlr-kotlin = "1.0.10"
bouncycastle = "1.86"
essential-kson = "2.18"
angus-mail = "2.0.5"
greenmail = "2.1.15"
# last 0.64.x; JVM-only by design — server-side rendering, not part of kroom's KMP surface
flexmark = "0.64.8"
kotlin-logging = "7.0.7"
kotlinx-atomicfu = "0.33.0"
ktor = "3.6.1"
nimbus-oidc-sdk = "11.14"
slf4j = "2.0.20"
velocity = "3.0.0-BETA-20261101-01"
junit-jupiter = "5.13.3"
web-push = "5.1.1"
versionsPlugin = "0.67.0"

[libraries]
antlr-kotlin = { module = "com.strumenta:antlr-kotlin-runtime", version.ref = "antlr-kotlin" }
antlr-kotlin-target = { module = "com.strumenta:antlr-kotlin-target", version.ref = "antlr-kotlin" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
essential-kson = { module = "com.republicate.kson:essential-kson", version.ref = "essential-kson" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angus-mail" }
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
# core + the GFM set; no flexmark-all, and no subscript ext (it fights strikethrough over `~`)
flexmark = { module = "com.vladsch.flexmark:flexmark", version.ref = "flexmark" }
flexmark-ext-autolink = { module = "com.vladsch.flexmark:flexmark-ext-autolink", version.ref = "flexmark" }
flexmark-ext-gfm-strikethrough = { module = "com.vladsch.flexmark:flexmark-ext-gfm-strikethrough", version.ref = "flexmark" }
flexmark-ext-gfm-tasklist = { module = "com.vladsch.flexmark:flexmark-ext-gfm-tasklist", version.ref = "flexmark" }
flexmark-ext-tables = { module = "com.vladsch.flexmark:flexmark-ext-tables", version.ref = "flexmark" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging"}
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin"}
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinx-atomicfu" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-sessions = { module = "io.ktor:ktor-server-sessions", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-default-headers = { module = "io.ktor:ktor-server-default-headers", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
velocity-engine-core = { module = "org.apache.velocity:velocity-engine-core", version.ref = "velocity" }
velocity-engine-common = { module = "org.apache.velocity:velocity-engine-common", version.ref = "velocity" }
velocity-engine-dom = { module = "org.apache.velocity:velocity-engine-dom", version.ref = "velocity" }
velocity-engine-scripting = { module = "org.apache.velocity:velocity-engine-scripting", version.ref = "velocity" }
velocity-engine-gradle-plugin = { module = "org.apache.velocity:velocity-engine-gradle-plugin", version.ref = "velocity" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
web-push = { module = "nl.martijndwars:web-push", version.ref = "web-push" }
nimbus-oidc-sdk = { module = "com.nimbusds:oauth2-oidc-sdk", version.ref = "nimbus-oidc-sdk" }

# Android
androidx-core = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
androidx-webkit = { module = "androidx.webkit:webkit", version = "1.12.1" }
android-material = { module = "com.google.android.material:material", version = "1.12.0" }

[plugins]
android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
antlr = { id = "com.strumenta.antlr-kotlin", version.ref = "antlr-kotlin" }
atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "kotlinx-atomicfu" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versionsPlugin" }
