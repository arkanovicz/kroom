<!DOCTYPE html>
<html lang="$lang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chifoumi Arena - Match</title>
    <link rel="stylesheet" href="/lib/pico/pico.min.css">
    <link rel="stylesheet" href="/css/chifoumi.css">
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><a href="/$lang/index.html"><strong>Chifoumi Arena</strong></a></li>
            </ul>
            <ul>
                <li id="match-info">
                    Round <span id="round-num">1</span>/3
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <article id="game-area">
            <!-- Score display -->
            <div class="score-board">
                <div class="player player-1">
                    <span class="player-name" id="player1-name">Player 1</span>
                    <span class="player-score" id="player1-score">0</span>
                </div>
                <div class="vs">VS</div>
                <div class="player player-2">
                    <span class="player-name" id="player2-name">Player 2</span>
                    <span class="player-score" id="player2-score">0</span>
                </div>
            </div>

            <!-- Game state messages -->
            <div id="game-message" class="game-message">
                Choose your move!
            </div>

            <!-- Move buttons -->
            <div id="move-buttons" class="move-buttons">
                <button class="move-btn" data-move="rock" title="Rock">
                    <span class="emoji">🪨</span>
                    <span class="label">Rock</span>
                </button>
                <button class="move-btn" data-move="paper" title="Paper">
                    <span class="emoji">📄</span>
                    <span class="label">Paper</span>
                </button>
                <button class="move-btn" data-move="scissors" title="Scissors">
                    <span class="emoji">✂️</span>
                    <span class="label">Scissors</span>
                </button>
                <button class="move-btn" data-move="well" title="Well">
                    <span class="emoji">🕳️</span>
                    <span class="label">Well</span>
                </button>
            </div>

            <!-- Round result display -->
            <div id="round-result" class="round-result" style="display: none;">
                <div class="moves-reveal">
                    <div class="revealed-move" id="your-move">
                        <span class="emoji"></span>
                        <span class="label">You</span>
                    </div>
                    <div class="result-indicator" id="result-indicator">VS</div>
                    <div class="revealed-move" id="opponent-move">
                        <span class="emoji"></span>
                        <span class="label">Opponent</span>
                    </div>
                </div>
                <p id="round-message"></p>
            </div>

            <!-- Match result -->
            <div id="match-result" class="match-result" style="display: none;">
                <h2 id="match-result-title">Match Over!</h2>
                <p id="match-result-message"></p>
                <button id="play-again-btn" class="primary">Play Again</button>
                <a href="/$lang/index.html" role="button" class="secondary">Back to Lobby</a>
            </div>
        </article>
    </main>

    <script src="/js/domhelper.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/sse.js"></script>
    <script src="/js/game.js"></script>
</body>
</html>
